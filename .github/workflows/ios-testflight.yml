name: iOS · Renovar perfil App Store
on: workflow_dispatch
permissions:
  contents: write

jobs:
  renew:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Renovar el perfil App Store de Match y verificar HealthKit
        env:
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL || 'https://github.com/FontalvoB/antares-paciente.git' }}
          MATCH_GIT_BRANCH: ${{ vars.MATCH_GIT_BRANCH || 'match-certificates' }}
          GH_TOKEN: ${{ github.token }}
          FORCE_SIGNING: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_OPT_OUT_USAGE: "true"
        run: |
          set -euo pipefail
          umask 077
          export APP_STORE_CONNECT_API_KEY_PATH="$RUNNER_TEMP/asc-signing.p8"
          trap 'rm -f "$APP_STORE_CONNECT_API_KEY_PATH"' EXIT
          printf '%s' "$ASC_KEY_B64" | base64 --decode > "$APP_STORE_CONNECT_API_KEY_PATH"
          export MATCH_GIT_BASIC_AUTHORIZATION="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$MATCH_GIT_BASIC_AUTHORIZATION"
          unset ASC_KEY_B64 GH_TOKEN
          bundle exec fastlane ios signing
          python3 - <<'PY'
          import datetime, pathlib, plistlib, subprocess
          app = "XZSSM34MU6.com.coppadresd.mobile"
          roots = (
              pathlib.Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles",
              pathlib.Path.home() / "Library/MobileDevice/Provisioning Profiles",
          )
          for root in roots:
              for path in root.glob("*.mobileprovision"):
                  result = subprocess.run(["security", "cms", "-D", "-i", str(path)], capture_output=True)
                  if result.returncode:
                      continue
                  profile = plistlib.loads(result.stdout)
                  if profile.get("Name") != "match AppStore com.coppadresd.mobile":
                      continue
                  entitlements = profile["Entitlements"]
                  if (entitlements.get("application-identifier") == app
                          and entitlements.get("com.apple.developer.healthkit") is True
                          and entitlements.get("aps-environment") == "production"
                          and profile["ExpirationDate"] > datetime.datetime.utcnow()):
                      print("Perfil App Store confirmado: HealthKit = true, push = production.")
                      break
              else:
                  continue
              break
          else:
              raise SystemExit("El perfil App Store de Match no autoriza HealthKit y push de producción.")
          PY
