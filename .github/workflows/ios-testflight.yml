# =============================================================================
# iOS · TestFlight — CI/CD de ANTARES Paciente (Ionic + Capacitor 8)
#
# Push/merge a `dev` → validaciones (lint, tests, i18n, build web).
# Solo el payload de Copp Adresd legado puede pasar al upload de TestFlight.
#
# Manual: Actions ▸ "iOS · TestFlight" ▸ Run workflow (con opción dry-run).
#
# Requisitos (una sola vez): secretos APP_STORE_CONNECT_*, APPLE_TEAM_ID,
# MATCH_PASSWORD y MATCH_GIT_BASIC_AUTHORIZATION, más el repo privado de
# certificados. Paso a paso: docs/IOS_CICD_TESTFLIGHT.md
# =============================================================================

name: iOS · TestFlight

on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".agents/**"
      - "android/**"
  # En PRs hacia dev solo corre el job de validaciones (sin secretos ni upload).
  pull_request:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".agents/**"
      - "android/**"
  # Para desplegar también desde `main` (cuando se promueva):
  #   branches: [dev, main]
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Dry run: compilar/archivar sin subir a TestFlight"
        type: boolean
        default: true
      build_number:
        description: "Forzar número de build (vacío = último de TestFlight + 1)"
        type: string
        required: false

# Nunca dos despliegues en paralelo (evita números de build duplicados).
concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  # fastlane/xcodebuild: evita timeouts largos consultando build settings.
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "10"
  FASTLANE_XCODE_LIST_TIMEOUT: "60"
  FASTLANE_SKIP_UPDATE_CHECK: "true"
  FASTLANE_OPT_OUT_USAGE: "true"

jobs:
  # ---------------------------------------------------------------------------
  # 1) Validaciones + build web de producción (rápido, en Linux).
  # ---------------------------------------------------------------------------
  quality:
    name: Validaciones (lint · tests · i18n · build web)
    # Imagen fija (no `ubuntu-latest`): evita migraciones sorpresa de runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      legacy_upload_allowed: ${{ steps.destination.outputs.legacy_upload_allowed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn

      - name: Instalar dependencias (yarn.lock)
        run: yarn install --frozen-lockfile

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: i18n (es/en)
        run: npm run i18n:check

      - name: Guardas de release (ATS y número de build dinámico)
        run: npm run release:check

      - name: Probar la guarda de destino TestFlight
        run: node --test scripts/check-ios-upload-destination.test.mjs

      - name: Build web de producción (vite)
        run: npm run build
        env:
          VITE_CHAT_NUTRITION_ENABLED: "true"

      - name: Resolver destino legacy de TestFlight
        id: destination
        env:
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
        run: |
          if node scripts/check-ios-upload-destination.mjs dist/ios-release-target.json com.coppadresd.mobile; then
            echo "legacy_upload_allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "legacy_upload_allowed=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$SKIP_UPLOAD" != "true" ]; then
              echo "::error::El build solicitado no puede publicarse en la ficha de Copp Adresd (KAN-182)."
              exit 1
            fi
            echo "::notice::El upload legado se omite para este payload (KAN-182)."
          fi

      - name: Publicar `dist/` para el job de firma
        uses: actions/upload-artifact@v7
        with:
          name: dist-web
          path: dist/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 2) Firma + archive + IPA + upload a TestFlight (macOS con Xcode).
  # ---------------------------------------------------------------------------
  testflight:
    name: iOS → TestFlight
    needs: quality
    # Los PRs nunca firman. El dry run manual solo archiva; los demás
    # eventos necesitan que el build de producción coincida con el legado.
    if: >-
      github.event_name != 'pull_request' &&
      (needs.quality.outputs.legacy_upload_allowed == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.skip_upload))
    # La imagen xcode-27 es ARM64 e incluye el SDK de iOS 27.
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Xcode 27.2 (fijado para builds reproducibles)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.2"

      - name: Ruby 3.4 + Bundler (cache de gems)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Verificar numeración de builds
        run: bundle exec ruby fastlane/tests/build_number_test.rb

      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn

      - name: Instalar dependencias JS (para Capacitor/SPM y cap sync)
        run: yarn install --frozen-lockfile

      - name: Descargar `dist/` ya validado (no se recompila el bundle)
        uses: actions/download-artifact@v7
        with:
          name: dist-web
          path: dist

      - name: Preparar App Store Connect API Key (.p8)
        env:
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/asc_private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_KEY_B64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$KEY_DIR"/AuthKey_*.p8
          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Capacitor sync (ios)
        run: npx cap sync ios

      - name: Preparar configuración iOS de Firebase si está habilitada
        env:
          FIREBASE_IOS_CONFIG_B64: ${{ secrets.FIREBASE_IOS_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_IOS_CONFIG_B64" ]; then
            config="ios/App/App/GoogleService-Info.plist"
            printf '%s' "$FIREBASE_IOS_CONFIG_B64" | base64 --decode > "$config"
            /usr/bin/plutil -lint -s "$config"
            bundle_id=$(/usr/libexec/PlistBuddy -c 'Print BUNDLE_ID' "$config")
            test "$bundle_id" = 'com.coppadresd.mobile'
          fi

      - name: Credencial de lectura para los certificados (GITHUB_TOKEN)
        env:
          GH_TOKEN_READ: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          match_auth="$(printf 'x-access-token:%s' "$GH_TOKEN_READ" | base64 | tr -d '\n')"
          echo "::add-mask::$match_auth"
          printf 'MATCH_GIT_BASIC_AUTHORIZATION=%s\n' "$match_auth" >> "$GITHUB_ENV"

      - name: Fastlane (firma + archive + IPA + TestFlight)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          # Certificados: rama interna `match-certificates` del propio repo
          # (cifrados con MATCH_PASSWORD). Para usar un repo privado aparte,
          # definí las variables MATCH_GIT_URL/MATCH_GIT_BRANCH y restaurá la
          # credencial PAT (ver docs/IOS_CICD_TESTFLIGHT.md).
          # OJO: si la variable de repo no existe, `vars.X` llega como cadena
          # vacía y fastlane la prioriza sobre el Matchfile (rompe el clone).
          # Por eso SIEMPRE tiene que resolver a un valor no vacío.
          MATCH_GIT_URL: "${{ vars.MATCH_GIT_URL || 'https://github.com/FontalvoB/antares-paciente.git' }}"
          MATCH_GIT_BRANCH: "${{ vars.MATCH_GIT_BRANCH || 'match-certificates' }}"
          MATCH_READONLY: "true"
          BUILD_NUMBER: ${{ inputs.build_number }}
          WAIT_FOR_PROCESSING: "true"
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
        run: |
          set -euo pipefail
          if [ "$SKIP_UPLOAD" = "true" ]; then
            echo "▶️  Dry run: solo archive (sin upload)"
            bundle exec fastlane ios build skip_web_build:true
          else
            bundle exec fastlane ios beta skip_web_build:true
          fi

      - name: Subir IPA / dSYMs como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-artifacts-${{ github.run_number }}
          path: |
            ios/App/output/*.ipa
            ios/App/output/*.dSYM.zip
          if-no-files-found: ignore
          retention-days: 7
